name: Yayın

# main'e giren her ürün değişikliğini iki mağazanın TEST izlerine götürür:
# Play kapalı test + TestFlight. Mağazaya göndermek elle kalıyor — bilerek.
#
# CI'nin ardından çalışıyor, paralel değil. `workflow_run` seçilmesinin sebebi:
# aynı dosyada iki iş yazılsaydı `needs` ile sıralanırdı ama derleme adımı, testler
# kırmızıyken de kuyruğa girmiş olurdu. Burada kırmızı CI hiç tetiklemiyor.
#
# İkisi de her push'ta otomatik: Play kapalı test ve TestFlight birlikte güncellenir.
# Bir ara iOS elle tetiklemeye alınmıştı (özel depoda macOS dakikası 10 kat); depo
# herkese açık olduğu için o maliyet yok ve karar geri alındı.
#
# DERLEME GITHUB KOŞUCULARINDA, EAS bulutunda değil (`eas build --local`).
# EAS'in ücretsiz planında aylık derleme kotası var ve iOS tarafı 2026-08-25'te
# doldu: hattın kendisi doğruyken günlerce hiçbir şey çıkmıyordu. Yerel derlemede
# o kota hiç devreye girmiyor; EAS yalnızca kimlik çözümü ve sürüm sayacı için.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      platform:
        description: Hangi platform
        type: choice
        options: [ikisi, ios, android]
        default: ikisi
      iz:
        description: Play izi (alpha = kapalı test)
        type: choice
        options: [internal, alpha, beta]
        default: internal
      zorla:
        description: Ürün değişmemiş olsa da derle
        type: boolean
        default: false

concurrency:
  # Sürüm numarası EAS tarafında artıyor; iki yayın aynı anda koşarsa numaralar
  # çakışır ve hangi derlemenin hangi commit olduğu belirsizleşir. Kuyruğa alınıyor,
  # iptal EDİLMİYOR: yarıda kesilen bir yayın mağazada yarım iş bırakabilir.
  group: yayin
  cancel-in-progress: false

permissions:
  contents: write # yayın etiketini atmak için

jobs:
  kapi:
    name: Gerek var mı
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      derle: ${{ steps.karar.outputs.derle }}
      notlar_kisa: ${{ steps.notlar.outputs.kisa }}
      notlar_uzun: ${{ steps.notlar.outputs.uzun }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # etiket geçmişi lazım
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - id: karar
        name: Son yayından beri ürün değişti mi
        # Derleme artık GitHub dakikası harcıyor ve özel depoda macOS çarpanı 10.
        # Yalnızca belge veya betik değiştiren bir commit'e iOS derlemesi harcamak,
        # ayın kalanını dakikasız bırakmak demek.
        #
        # `packages/api` bilerek listede YOK: sunucu kodu mobil pakete girmiyor.
        # Yalnız API'yi düzelten bir commit iki derleme birden yakardı ve
        # kullanıcının telefonundaki hiçbir şey değişmezdi.
        run: |
          set -euo pipefail
          if [ "${{ inputs.zorla }}" = "true" ]; then
            echo "derle=evet" >> "$GITHUB_OUTPUT"; echo "zorlandı"; exit 0
          fi
          son="$(git describe --tags --abbrev=0 --match 'yayin-*' 2>/dev/null || true)"
          if [ -z "$son" ]; then
            echo "derle=evet" >> "$GITHUB_OUTPUT"; echo "ilk yayın"; exit 0
          fi
          degisen="$(git diff --name-only "$son"..HEAD -- apps/mobile packages/core packages/shared | wc -l)"
          echo "$son sonrası ürün dosyası değişikliği: $degisen"
          if [ "$degisen" -gt 0 ]; then
            echo "derle=evet" >> "$GITHUB_OUTPUT"
          else
            echo "derle=hayir" >> "$GITHUB_OUTPUT"
            echo "::notice::Ürün kodu değişmemiş; derleme atlandı."
          fi

      - uses: actions/setup-node@v4
        if: steps.karar.outputs.derle == 'evet'
        with: { node-version: 22 }

      - id: notlar
        name: Sürüm notları
        if: steps.karar.outputs.derle == 'evet'
        run: |
          set -euo pipefail
          node scripts/surum-notlari.mjs
          json="$(node scripts/surum-notlari.mjs --json)"
          {
            echo "kisa<<SWIIP_EOF"
            node -e "process.stdout.write(JSON.parse(process.argv[1]).kisa)" "$json"
            echo
            echo "SWIIP_EOF"
            echo "uzun<<SWIIP_EOF"
            node -e "process.stdout.write(JSON.parse(process.argv[1]).uzun)" "$json"
            echo
            echo "SWIIP_EOF"
          } >> "$GITHUB_OUTPUT"

  android:
    name: Play kapalı test
    needs: kapi
    if: >-
      needs.kapi.outputs.derle == 'evet' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform != 'ios')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - run: npm ci

      - name: İmzalama malzemesi
        # `credentialsSource: local` — anahtarlar depoda DEĞİL (gitignore) ve olmamalı.
        # Koşucuda `credentials.json`'ın beklediği göreli yollara yazılıyorlar;
        # böylece CI ile yerel derleme birebir aynı kimlikle imzalıyor.
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
        run: |
          set -euo pipefail
          for d in CREDENTIALS_JSON ANDROID_KEYSTORE_B64 IOS_DIST_P12_B64 IOS_PROVISION_B64; do
            test -n "${!d:-}" || { echo "$d sırrı yok"; exit 1; }
          done
          mkdir -p apps/mobile/kimlik
          printf '%s' "$CREDENTIALS_JSON" > apps/mobile/credentials.json
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > apps/mobile/kimlik/yukleme.jks
          printf '%s' "$IOS_DIST_P12_B64"     | base64 -d > apps/mobile/kimlik/dagitim.p12
          printf '%s' "$IOS_PROVISION_B64"    | base64 -d > apps/mobile/kimlik/swiip-appstore.mobileprovision
          node -e "
            const c=require('./apps/mobile/credentials.json'), fs=require('fs');
            for (const y of [c.ios.provisioningProfilePath, c.ios.distributionCertificate.path, c.android.keystore.keystorePath]) {
              const t='apps/mobile/'+y;
              if (!fs.statSync(t).size) { console.error('bos dosya: '+t); process.exit(1); }
            }
            console.log('imzalama malzemesi yerinde');
          "

      - name: Play servis hesabı anahtarı
        # `eas.json`'un `ci` gönderim profili `./play.json` diyor — yol apps/mobile'a
        # göreli. Depodaki `uretim` profili mutlak Windows yolu tutuyor, koşucuda yok.
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVIS_HESABI_JSON }}
        run: |
          set -euo pipefail
          test -n "$PLAY_JSON" || { echo "PLAY_SERVIS_HESABI_JSON sırrı yok"; exit 1; }
          printf '%s' "$PLAY_JSON" > apps/mobile/play.json
          node -e "JSON.parse(require('fs').readFileSync('apps/mobile/play.json','utf8'))"

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Derle (koşucuda, EAS bulutunda değil)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform android --profile uretim --local --non-interactive \
            --output "$RUNNER_TEMP/swiip.aab"
          ls -la "$RUNNER_TEMP/swiip.aab"

      - name: Play izine yükle
        # `eas submit` yerine doğrudan Play API'si (`play-yukle.mjs`): `eas.json`'daki
        # gönderim profili izi SABİT tutuyor, oysa iz artık bir değişken. İkisi
        # ayrışsaydı paket bir ize yüklenir, yayına alma başka izde aranırdı.
        env:
          PLAY_SERVIS_HESABI: apps/mobile/play.json
          IZ: ${{ inputs.iz || vars.PLAY_IZ || 'internal' }}
        run: node scripts/play-yukle.mjs yukle "$RUNNER_TEMP/swiip.aab" "$IZ"

      - name: Yayına al ve notu yaz
        # `eas submit` sürümü TASLAK bırakıyor ve taslak sürüm test cihazlarına
        # inmiyor: konsolda "yüklendi" görünürken kimse kuramıyor. Yayına almak
        # ayrı bir adım ve betik taahhütten sonra izi geri okuyup doğruluyor.
        #
        # versionCode `en-yeni`: yerel derlemede `eas build:list` bu paketi
        # görmüyor, tek doğru kaynak izin kendisi.
        #
        # İZ BİR DEĞİŞKENDE, kodda gömülü değil. Play şu an uygulamayı "taslak
        # uygulama" sayıyor ve o durumda KAPALI TESTE yayına alma isteğini
        # reddediyor ("Only releases with status draft may be created on draft
        # app"); iç test izi kabul ediyor. Console tarafındaki maddeler bitip
        # uygulama taslaktan çıkınca tek komut yeter, kod değişmiyor:
        #   gh variable set PLAY_IZ --body alpha
        env:
          PLAY_SERVIS_HESABI: apps/mobile/play.json
          IZ: ${{ inputs.iz || vars.PLAY_IZ || 'internal' }}
          NOTLAR: ${{ needs.kapi.outputs.notlar_kisa }}
        run: node scripts/play-yayinla.mjs "$IZ" en-yeni "$NOTLAR"

  ios:
    name: TestFlight
    needs: kapi
    # iOS OTOMATİK KOŞAR — Android ile aynı şekilde.
    #
    # Bir ara elle tetiklemeye alınmıştı: bir iOS derlemesi ~25-30 dakika macOS
    # koşucusu ve **özel** depolarda macOS dakikası 10 kat sayılıyor, yani derleme
    # başına ~250-300 faturalanan dakika. 2026-08-25'te iki derleme 528 dakika yedi.
    #
    # O gerekçe artık yok: depo herkese açık ve herkese açık depolarda GitHub Actions
    # ücretsiz ve sınırsız, macOS dahil. Karar ölçülmüş bir maliyete dayanıyordu ve
    # maliyet ortadan kalkınca kararın da kalkması gerekiyor.
    #
    # Kural: main'e giren her ürün değişikliği İKİ mağazanın test izine birden gider —
    # Play kapalı test ve TestFlight. Yalnız birine gitmesi, iki mağazanın farklı
    # sürümleri test etmesi demek; hangi hatanın hangi derlemede olduğu kaybolur.
    #
    # `platform` girdisi elle tetiklemede hâlâ tek platform seçmeye yarıyor.
    if: >-
      needs.kapi.outputs.derle == 'evet' &&
      (github.event_name != 'workflow_dispatch' || inputs.platform != 'android')
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: İmzalama malzemesi
        env:
          CREDENTIALS_JSON: ${{ secrets.CREDENTIALS_JSON }}
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          IOS_DIST_P12_B64: ${{ secrets.IOS_DIST_P12_B64 }}
          IOS_PROVISION_B64: ${{ secrets.IOS_PROVISION_B64 }}
        run: |
          set -euo pipefail
          for d in CREDENTIALS_JSON ANDROID_KEYSTORE_B64 IOS_DIST_P12_B64 IOS_PROVISION_B64; do
            test -n "${!d:-}" || { echo "$d sırrı yok"; exit 1; }
          done
          mkdir -p apps/mobile/kimlik
          printf '%s' "$CREDENTIALS_JSON" > apps/mobile/credentials.json
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 -d > apps/mobile/kimlik/yukleme.jks
          printf '%s' "$IOS_DIST_P12_B64"     | base64 -d > apps/mobile/kimlik/dagitim.p12
          printf '%s' "$IOS_PROVISION_B64"    | base64 -d > apps/mobile/kimlik/swiip-appstore.mobileprovision
          node -e "
            const c=require('./apps/mobile/credentials.json'), fs=require('fs');
            for (const y of [c.ios.provisioningProfilePath, c.ios.distributionCertificate.path, c.android.keystore.keystorePath]) {
              const t='apps/mobile/'+y;
              if (!fs.statSync(t).size) { console.error('bos dosya: '+t); process.exit(1); }
            }
            console.log('imzalama malzemesi yerinde');
          "

      - name: App Store Connect anahtarı
        env:
          ASC_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          set -euo pipefail
          test -n "$ASC_P8" || { echo "ASC_API_KEY_P8 sırrı yok"; exit 1; }
          printf '%s' "$ASC_P8" | base64 -d > apps/mobile/asc.p8
          grep -q 'BEGIN PRIVATE KEY' apps/mobile/asc.p8 || { echo "anahtar bozuk"; exit 1; }

      - name: Xcode ve iOS SDK sürümü
        # Apple, yüklenen paketin iOS 26 SDK'sıyla derlenmiş olmasını şart koşuyor;
        # build 3 tam bu yüzden ITMS-90725 ile geri döndü (iOS 18.2 SDK'sıyla
        # derlenmişti). Koşucu imajı eskiyse derleme SORUNSUZ bitiyor ve iş yalnızca
        # YÜKLEMEDE patlıyor — yani ~30 dakika macOS dakikası (10× çarpanla ~300)
        # harcandıktan sonra. Kontrol bu yüzden en başta.
        run: |
          set -euo pipefail
          echo "kurulu Xcode sürümleri:"
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          en_yeni="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          test -n "$en_yeni" || { echo "::error::Xcode bulunamadı"; exit 1; }
          sudo xcode-select -s "$en_yeni/Contents/Developer"
          xcodebuild -version
          sdk="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iOS SDK: $sdk"
          if [ "${sdk%%.*}" -lt 26 ]; then
            echo "::error::Koşucudaki iOS SDK $sdk; Apple 26 istiyor (ITMS-90725). Derleme başlatılmadı."
            exit 1
          fi

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Derle (koşucuda, EAS bulutunda değil)
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set -euo pipefail
          eas build --platform ios --profile uretim --local --non-interactive \
            --output "$RUNNER_TEMP/swiip.ipa"
          ls -la "$RUNNER_TEMP/swiip.ipa"

      - name: TestFlight'a yükle
        working-directory: apps/mobile
        run: eas submit --platform ios --profile ci --path "$RUNNER_TEMP/swiip.ipa" --non-interactive

      - name: TestFlight sürüm notu
        # Derleme numarası IPA'DAN okunuyor, "en yeni derleme"den değil.
        #
        # İlk gerçek koşuda `--son` kullanıldı ve not YANLIŞ DERLEMEYE yazıldı:
        # bu adım çalıştığında Apple yeni derlemeyi henüz listelememişti, `--son`
        # da listedeki en yeniyi (bir önceki derlemeyi) seçti. Yeni derleme notsuz
        # kaldı ve eski derlemenin notunun üstüne yazıldı. İkisi de sessizdi —
        # iş yeşil bitti. IPA'nın `CFBundleVersion`'ı ne yüklediğimizin tek kanıtı.
        #
        # Dil kodu `tr`: TestFlight `tr-TR`'yi reddediyor, mağaza metinlerinden farklı.
        env:
          EXPO_ASC_API_KEY_PATH: apps/mobile/asc.p8
          EXPO_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          EXPO_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          NOTLAR: ${{ needs.kapi.outputs.notlar_uzun }}
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/ipa" && mkdir -p "$RUNNER_TEMP/ipa"
          unzip -o -q "$RUNNER_TEMP/swiip.ipa" -d "$RUNNER_TEMP/ipa"
          plist="$(find "$RUNNER_TEMP/ipa/Payload" -maxdepth 2 -name Info.plist | head -1)"
          test -n "$plist" || { echo "::error::IPA icinde Info.plist yok"; exit 1; }
          numara="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")"
          echo "yuklenen derleme numarasi: $numara"
          node scripts/testflight-notlar.mjs "$numara" "$NOTLAR"

  etiket:
    name: Yayını etiketle
    needs: [kapi, android, ios]
    # Biri atlandıysa (tek platform seçildi) yine etiketlensin; ama BAŞARISIZ
    # olduysa etiketlenmesin — yoksa bir sonraki koşu bu commit'i "yayınlandı"
    # sayar ve düşen platform sessizce geride kalır.
    if: >-
      always() && needs.kapi.outputs.derle == 'evet' &&
      needs.android.result != 'failure' && needs.ios.result != 'failure' &&
      (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}
      - name: Etiket at
        run: |
          set -euo pipefail
          ad="yayin-$(date -u +%Y%m%d-%H%M)"
          git config user.name  'swiip-yayin'
          git config user.email 'bilgi@send.swiip.app'
          git tag -a "$ad" -m "Play: ${{ needs.android.result }} · TestFlight: ${{ needs.ios.result }}"
          git push origin "$ad"
          echo "::notice::$ad etiketlendi; bir sonraki sürüm notu buradan başlayacak."

  bildirim:
    name: Bildirim
    needs: [kapi, android, ios, etiket]
    # `always()`: asıl değeri BAŞARISIZLIKTA. Yalnız başarıda koşan bir bildirim,
    # sessizliği "her şey yolunda" diye okutur — oysa sessizlik hem başarı hem çöküş
    # anlamına gelir. GitHub'ın kendi e-postası da yalnız hataya ve yalnız commit'i
    # atana gidiyor, üstelik kişinin bildirim ayarına bağlı.
    if: always() && needs.kapi.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Sonucu gönder
        env:
          POSTA_API_KEY: ${{ secrets.POSTA_API_KEY }}
          BILDIRIM_ALICI: ${{ secrets.BILDIRIM_ALICI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_SOHBET_ID: ${{ secrets.TELEGRAM_SOHBET_ID }}
          DURUM: >-
            ${{ (needs.android.result == 'failure' || needs.ios.result == 'failure')
                && 'failure'
                || (needs.kapi.outputs.derle != 'evet' && 'skipped' || 'success') }}
          BAGLANTI: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DERLE: ${{ needs.kapi.outputs.derle }}
          ANDROID: ${{ needs.android.result }}
          IOS: ${{ needs.ios.result }}
          ETIKET: ${{ needs.etiket.result }}
          NOTLAR: ${{ needs.kapi.outputs.notlar_kisa }}
          BASLIK_COMMIT: ${{ github.event.workflow_run.head_commit.message || github.sha }}
        run: |
          set -euo pipefail
          baslik="Swiip yayın"
          if [ "$DERLE" != "evet" ]; then
            baslik="Swiip yayın — atlandı (ürün değişmemiş)"
          fi
          {
            echo "Play kapalı test : $ANDROID"
            echo "TestFlight       : $IOS"
            echo "Etiket           : $ETIKET"
            echo
            echo "Commit: $(printf '%s' "$BASLIK_COMMIT" | head -1)"
            if [ -n "${NOTLAR:-}" ]; then
              echo
              echo "Sürüm notu:"
              printf '%s\n' "$NOTLAR"
            fi
          } > ayrinti.txt
          cat ayrinti.txt
          BASLIK="$baslik" AYRINTI="$(cat ayrinti.txt)" node scripts/bildirim-gonder.mjs
