name: swiip

# Konteyner sertleştirmesi — her servis bu iki bloktan birini alıyor.
#
# - `no-new-privileges`: setuid ikililer yetki yükseltemez.
# - Günlük boyutu sınırlı: Docker'ın varsayılan json-file sürücüsü SINIRSIZ büyür.
#   Bir hata döngüsü ya da log seli 48 GB'lık diski doldurur ve Postgres yazamaz
#   hâle gelir — dışarıdan tetiklenebilen bir veri kaybı yolu.
# - `cap_drop: [ALL]`: çekirdek yetkilerinin hiçbiri. Node süreçleri hiçbirine
#   ihtiyaç duymuyor; caddy yalnız 80/443'e bağlanmak için birini geri alıyor.
# - Salt okunur kök dosya sistemi: ele geçirilmiş bir süreç imaja kalıcı bir şey
#   yazamaz. tsx derleme önbelleğini /tmp'ye yazıyor, o yüzden /tmp bellekte.
#
# `sertlestirme.test.ts` her servisin bunları almasını kilitliyor.
x-gunluk: &gunluk
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

x-node-sertlestirme: &node-sertlestirme
  security_opt: ['no-new-privileges:true']
  cap_drop: [ALL]
  read_only: true
  tmpfs: ['/tmp:size=64m,mode=1777']
  logging: *gunluk

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    # Giriş betiği veri dizininin sahipliğini ayarlayıp `postgres` kullanıcısına
    # geçiyor; bu beş yetki o iş için, fazlası değil.
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    shm_size: 128m
    logging: *gunluk
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-swiip}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD gerekli}
      POSTGRES_DB: ${POSTGRES_DB:-swiip}
      # Türkçe sıralama: "İ" ve "ı" doğru sıralansın.
      LANG: tr_TR.utf8
    volumes:
      - postgres_veri:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-swiip} -d ${POSTGRES_DB:-swiip}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    # Veritabanı dışarı açılmaz; yalnızca iç ağdan erişilir.
    expose:
      - '5432'
    networks: [ic]

  # Göç adımı. Tek seferlik çalışır, biter ve API onun bitmesini bekler.
  #
  # Neden ayrı servis: göçü API'nin açılışına gömmek, birden çok kopya çalıştığında
  # aynı göçü aynı anda uygulamaya kalkar. Ayrı ve tek seferlik adım, sırayı garanti eder.
  #
  # 2026-08-21'de ilk kurulumda bu adım yoktu: API sağlıklı göründü, /saglik 200 döndü,
  # ama veritabanında tek tablo yoktu. Sessiz kusur; şema elle kuruldu.
  gocmen:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: 'no'
    <<: *node-sertlestirme
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-swiip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swiip}
      # Göçlerden sonra API'nin süper kullanıcı OLMAYAN rolü bu parolayla kuruluyor.
      UYGULAMA_DB_PAROLASI: ${UYGULAMA_DB_PAROLASI:?UYGULAMA_DB_PAROLASI gerekli}
      # goc.ts yapılandırmanın tamamını okuyor; JWT_SECRET onun için de zorunlu.
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli, en az 32 karakter}
    command: ['node', '--import', 'tsx', 'packages/api/src/db/goc.ts']
    networks: [ic]

  # Tohumlama: sema kurulduktan sonra katalog doldurulur.
  #
  # Bu adim uzun sure YOKTU ve kusuru sessizdi: uretimde 28 tablo vardi, besin ve
  # tarif tablolari BOSTU. API saglikli, /saglik 200, konteyner "healthy" — ama besin
  # aramasi bos donuyor, ogun plani kurulamiyor, fotograftan tanima eslesemiyordu.
  # Uclu de hata vermiyor, "sonuc yok" diyordu. Ancak bir yedek geri yuklenip icine
  # bakilinca goruldu.
  #
  # Tohumlama tekrar calistirilabilir: ayni ad tekrar eklenmez, degerler guncellenir.
  # Bu yuzden her dagitimda calismasi hem guvenli hem dogru.
  tohumcu:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: 'no'
    <<: *node-sertlestirme
    depends_on:
      gocmen:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-swiip}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swiip}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli, en az 32 karakter}
    command: ['node', '--import', 'tsx', 'packages/api/src/db/tohum.ts']
    networks: [ic]

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    restart: unless-stopped
    <<: *node-sertlestirme
    # Bellek ve süreç sınırı: kaçak bir istek (dev bir gövde, sonsuz döngü) tek
    # vCPU / 2 GB'lık makinede Postgres'i de boğmasın.
    mem_limit: 768m
    pids_limit: 256
    depends_on:
      postgres:
        condition: service_healthy
      # Goc bagimliligi ACIKCA duruyor. Tohumcu zaten gocu bekliyor, yani bu satir
      # teknik olarak gereksiz — ama tohumlama adimi bir gun kaldirilirsa api yine
      # gocleri beklemeye devam etsin. Sessiz kusurun tekrarlamasi bu satirin
      # maliyetinden pahali.
      gocmen:
        condition: service_completed_successfully
      # Tohumlama bitmeden acilmiyor: katalog dolmadan istek almak, besin aramasini
      # sessizce bos donduren o kusurun ta kendisiydi.
      tohumcu:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      # API süper kullanıcıyla DEĞİL, yalnız veri okuyup yazabilen rolle bağlanıyor
      # (db/uygulamaRolu.ts). Süper kullanıcı bağlantısı, tek bir SQL enjeksiyonunu
      # `COPY ... TO PROGRAM` ile konteynerde komut yürütmeye çevirirdi.
      DATABASE_URL: postgres://swiip_uygulama:${UYGULAMA_DB_PAROLASI:?UYGULAMA_DB_PAROLASI gerekli}@postgres:5432/${POSTGRES_DB:-swiip}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET gerekli, en az 32 karakter}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_KEY: ${AI_GATEWAY_KEY:-}
      REVENUECAT_KANCA_SIRRI: ${REVENUECAT_KANCA_SIRRI:-}
      KIMLIK_ISTEK_SINIRI: ${KIMLIK_ISTEK_SINIRI:-10}
      POSTA_API_URL: ${POSTA_API_URL:-}
      POSTA_API_KEY: ${POSTA_API_KEY:-}
      POSTA_GONDEREN: ${POSTA_GONDEREN:-Swiip <merhaba@swiip.app>}
      YONETIM_ANAHTARI: ${YONETIM_ANAHTARI:-}
      LOG_SEVIYESI: ${LOG_SEVIYESI:-info}
      CORS_KAYNAKLAR: ${CORS_KAYNAKLAR:-*}
    expose:
      - '3000'
    networks: [ic, dis]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/saglik').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api]
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    logging: *gunluk
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      ALAN_ADI: ${ALAN_ADI:-swiip.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Marka sitesi statik; derleme adımı yok, doğrudan bağlanıyor.
      - ../apps/site:/site:ro
      - caddy_veri:/data
      - caddy_yapilandirma:/config
    networks: [dis]

  yedekleyici:
    image: postgres:17-alpine
    restart: unless-stopped
    security_opt: ['no-new-privileges:true']
    cap_drop: [ALL]
    logging: *gunluk
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-swiip}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-swiip}
      YEDEK_SAKLAMA_GUN: ${YEDEK_SAKLAMA_GUN:-30}
    volumes:
      - ../yedekler:/yedekler
      - ../scripts/yedek-al.sh:/yedek-al.sh:ro
    entrypoint: ['/bin/sh', '-c']
    # Her gece 03:15'te yedek al. Kullanıcı verisi kabul etmeden önce
    # geri yükleme bir kez gerçekten denenmiş olmalı (scripts/yedek-geri-yukleme-testi.sh).
    command: >
      "while true; do
         su_an=$$(date +%H%M);
         if [ \"$$su_an\" = '0315' ]; then sh /yedek-al.sh; sleep 60; fi;
         sleep 30;
       done"
    networks: [ic]

volumes:
  postgres_veri:
  caddy_veri:
  caddy_yapilandirma:

networks:
  ic:
    internal: true
  dis:
